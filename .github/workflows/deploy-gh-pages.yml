name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:gh

      - name: Strip the rating-script backup from dist
        run: rm -f dist/tagged.json.bak-pre-importance

      - name: Touch .nojekyll (Pages serves the SPA as static files)
        run: touch dist/.nojekyll

      - name: Push to Dedibeat/dedibeat.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
          external_repository: Dedibeat/dedibeat.github.io
          publish_branch: main
          publish_dir: ./dist
          keep_files: false
          exclude_assets: ""
          commit_message: "Deploy from Dedibeat/my-react-app@${{ github.sha }}"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
