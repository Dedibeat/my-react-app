name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:gh

      - name: Strip the rating-script backup from dist
        run: rm -f dist/tagged.json.bak-pre-importance

      - name: Touch .nojekyll (Pages serves the SPA as static files)
        run: touch dist/.nojekyll

      - name: Set up Pages deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PAGES_DEPLOY_KEY }}" > ~/.ssh/pages_deploy_key
          chmod 600 ~/.ssh/pages_deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Configure dist/ as a git repo
        working-directory: ./dist
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy from Dedibeat/my-react-app@${{ github.sha }}"

      - name: Push to Dedibeat/dedibeat.github.io over SSH
        run: |
          git -c core.sshCommand="ssh -i ~/.ssh/pages_deploy_key -o StrictHostKeyChecking=no" \
              push git@github.com:Dedibeat/dedibeat.github.io.git "HEAD:main" --force
        working-directory: ./dist
